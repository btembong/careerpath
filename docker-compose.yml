services:
  caddy:
    image: caddy:2-alpine
    container_name: cpa_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - api

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    container_name: cpa_portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: cpa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpa_user
      POSTGRES_PASSWORD: cpa_password
      POSTGRES_DB: cpa_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpa_user -d cpa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cpa_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cpa_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Required: disables DEMO_ACCOUNTS (apps/api/.env is mounted below) and enforces a strong JWT_SECRET
      NODE_ENV: production
      DATABASE_URL: postgresql://cpa_user:cpa_password@postgres:5432/cpa_db
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
