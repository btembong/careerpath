<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <!-- Demo hand-in for the showcase seed: a student's quadratics worksheet -->
  <rect width="900" height="620" fill="#fffef8"/>
  <g stroke="#dbe4f5" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/><line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/><line x1="0" y1="240" x2="900" y2="240"/><line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="0" y1="320" x2="900" y2="320"/><line x1="0" y1="360" x2="900" y2="360"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="440" x2="900" y2="440"/><line x1="0" y1="480" x2="900" y2="480"/><line x1="0" y1="520" x2="900" y2="520"/>
    <line x1="0" y1="560" x2="900" y2="560"/>
  </g>
  <line x1="70" y1="0" x2="70" y2="620" stroke="#f3b3b3" stroke-width="2"/>
  <g font-family="'Segoe Print','Comic Sans MS',cursive" fill="#1d2a5c" font-size="22">
    <text x="90" y="52" font-size="26">Quadratics worksheet — Abena M.</text>
    <text x="90" y="112">1.  x² + 5x + 6 = 0  →  (x + 2)(x + 3) = 0  →  x = −2 or x = −3</text>
    <text x="90" y="152">2.  x² − 7x + 12 = 0  →  (x − 3)(x − 4) = 0  →  x = 3 or x = 4</text>
    <text x="90" y="192">3.  2x² + x − 6 = 0  →  (2x − 3)(x + 2) = 0  →  x = 1.5 or x = −2</text>
    <text x="90" y="232">4.  x² − 9 = 0  →  x = ±3</text>
    <text x="90" y="272">5.  x² + 4x − 1 = 0   use formula:  x = (−4 ± √20) / 2</text>
    <text x="150" y="312">x = −2 ± √5  ≈ 0.24 or −4.24</text>
    <text x="90" y="352">6.  x² − 6x + 9 = 0  →  (x − 3)² = 0  →  x = 3</text>
    <text x="90" y="392">7.  3x + 5x − 2 = 0  →  8x = 2  →  x = 0.25   ??</text>
    <text x="90" y="432">8.  x² + 2x − 15 = 0  →  (x + 5)(x − 3) = 0  →  x = −5 or 3</text>
    <text x="90" y="472">9.  4x² − 25 = 0  →  x = ± 5/2</text>
    <text x="90" y="512">10. x² − x − 20 = 0  →  (x − 5)(x + 4) = 0  →  x = 5 or −4</text>
  </g>
  <text x="640" y="392" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" fill="#c0392b">not sure about this one</text>
</svg>
